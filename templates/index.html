<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        /* Basic styling to make the page look clean */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Ensures padding doesn't widen the element */
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .note {
            font-size: 0.8rem;
            color: #777;
            text-align: center;
            margin-top: 15px;
        }
    </style>
    <script>
        // Javascript to hide the resolution dropdown if MP3 is selected
        function toggleQuality() {
            var format = document.getElementById("format").value;
            var qualityDiv = document.getElementById("quality-div");
            
            if (format === "mp3") {
                qualityDiv.style.display = "none";
            } else {
                qualityDiv.style.display = "block";
            }
        }
    </script>
</head>
<body>

    <div class="container">
        <h2>YouTube Downloader</h2>
        
        <form action="/download" method="POST">
            
            <label for="url">Paste Video Link:</label>
            <input type="text" id="url" name="url" placeholder="https://www.youtube.com/watch?v=..." required>

            <label for="format">Select Format:</label>
            <select name="format" id="format" onchange="toggleQuality()">
                <option value="mp4">MP4 (Video)</option>
                <option value="mp3">MP3 (Audio Only)</option>
            </select>

            <div id="quality-div">
                <label for="quality">Video Resolution:</label>
                <select name="quality" id="quality">
                    <option value="best">Best Available</option>
                    <option value="1080">1080p</option>
                    <option value="720">720p</option>
                    <option value="480">480p</option>
                </select>
            </div>

            <button type="submit">Download Now</button>
        </form>
        
        <p class="note">Please allow a few moments for the server to process the download.</p>
    </div>

</body>
</html>
